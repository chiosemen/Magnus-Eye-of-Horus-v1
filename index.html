<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnus Eye of Horus – Grandmaster Playbook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Runtime configuration must be provided by the backend; do not expose secrets in the browser.
        // Client should call relative endpoints (e.g., '/api') which are proxied by a secure backend.

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              borderRadius: {
                lg: "var(--radius)",
                xl: "calc(var(--radius) + 4px)",
                "2xl": "calc(var(--radius) + 8px)",
              },
              colors: {
                background: "#0B0F16",
                foreground: "#F8FAFC",
                card: "#0F1522",
                elevated: "#131B2E",
                muted: "#1E293B",
                "muted-foreground": "#94A3B8",
                border: "rgba(255,255,255,0.06)",
                primary: "#F8FAFC",
                accent: "#D4AF37", // Antique Gold
                "accent-hover": "#E2C96B",
                "signal-blue": "#4C6FFF",
                "severity-critical": "#EF4444",
                "severity-high": "#F97316",
                "severity-medium": "#D4AF37",
                "severity-low": "#64748B",
                blocked: "#450A0A",
                "blocked-foreground": "#FEE2E2",
              },
              fontFamily: {
                sans: ['Inter', 'Satoshi', 'SF Pro Display', 'sans-serif'],
                mono: ['JetBrains Mono', 'monospace'],
              },
            },
          },
        }
    </script>
    <style type="text/tailwindcss">
        @tailwind base;
        @tailwind components;
        @tailwind utilities;

        @layer base {
          :root {
            --radius: 12px;
          }
          body { @apply bg-background text-foreground tracking-tight selection:bg-accent/30 selection:text-white; }
        }

        .horus-gradient-text {
          background: linear-gradient(90deg, #E2C96B, #D4AF37, #B8962E);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          display: inline-block;
          /* Increased padding to prevent clipping of the slanted "S" in italics */
          padding-right: 0.12em;
          /* Optical adjustment for the slant */
          margin-right: -0.06em;
        }

        .hero-background {
          background: 
            radial-gradient(1200px 600px at 50% -10%, rgba(76,111,255,0.12), transparent 60%),
            linear-gradient(to bottom, #0B0F16, #070A10);
        }

        .custom-scrollbar::-webkit-scrollbar {
          width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: rgba(255,255,255,0.1);
          border-radius: 2px;
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/": "https://esm.sh/react@18.2.0/",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/": "https://esm.sh/react-dom@18.2.0/",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react",
        "zod": "https://esm.sh/zod@3.22.4",
        "class-variance-authority": "https://esm.sh/class-variance-authority@0.7.0",
        "clsx": "https://esm.sh/clsx@2.0.0",
        "tailwind-merge": "https://esm.sh/tailwind-merge@2.0.0",
        "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom"
      }
    }
    </script>
</head>
<body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
